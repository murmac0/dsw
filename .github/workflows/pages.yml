name: Deploy to GitHub Pages

# Publishes the workbench at https://<owner>.github.io/<repo>/ and
# Storybook at .../<repo>/storybook/ on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a deploy
# halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pages serves a project site under /<repo>/, so assets need that prefix.
      BASE_PATH: /${{ github.event.repository.name }}/
      SITE: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the workbench
        run: pnpm --filter @dsw/workbench exec vite build --base="$BASE_PATH" --outDir "$SITE"
      - name: Build Storybook
        run: pnpm --filter @dsw/workbench exec storybook build --quiet -o "$SITE/storybook"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
