name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the run already going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # also fails if packages/*/generated is out of date
      - run: pnpm build
      - name: Bundle @dsw/mcp (what other repos install)
        run: pnpm --filter @dsw/mcp build

  e2e:
    name: E2E (axe, contrast, forced colours, reflow in 6 themes)
    # Pinned: Playwright can't install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @dsw/workbench exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/workbench/test-results
            apps/workbench/playwright-report
          retention-days: 7

  consumer:
    name: Consumer (packed release in the starter app)
    # Pinned for the same reason as e2e: Playwright's Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @dsw/workbench exec playwright install --with-deps chromium
      - name: Pack every @dsw package, install the starter from the packs, run its checks
        run: pnpm test:consumer
        env:
          CONSUMER_DIR: ${{ runner.temp }}
